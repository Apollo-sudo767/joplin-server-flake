name: "Auto-Update Flake & Upstream Joplin"

on:
  schedule:
    # Run daily at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Check Updates & Create PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Run Flake & Upstream Updater
        run: |
          chmod +x scripts/update.sh
          ./scripts/update.sh

      - name: Determine Changes
        id: change-info
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"

            # Check if package.nix was modified (new Joplin Server version)
            if git diff --name-only | grep -q 'package.nix'; then
              NEW_VERSION=$(grep -E '^\s*version = "[^"]+"' package.nix | head -n1 | sed -E 's/.*version = "([^"]+)".*/\1/')
              echo "title=chore(deps): update Joplin Server to v${NEW_VERSION} and update flake inputs" >> "$GITHUB_OUTPUT"
              echo "summary=Upgraded Joplin Server upstream to **v${NEW_VERSION}** and updated flake inputs." >> "$GITHUB_OUTPUT"
            else
              echo "title=chore(deps): update flake inputs" >> "$GITHUB_OUTPUT"
              echo "summary=Updated flake inputs in \`flake.lock\`." >> "$GITHUB_OUTPUT"
            fi
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.change-info.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: ${{ steps.change-info.outputs.title }}
          branch: "automated-flake-update"
          delete-branch: true
          title: ${{ steps.change-info.outputs.title }}
          body: |
            ### 🤖 Automated Flake Update

            ${{ steps.change-info.outputs.summary }}

            #### Verification
            - Verified flake outputs and configurations with `nix flake check`.
          labels: |
            dependencies
            automated
